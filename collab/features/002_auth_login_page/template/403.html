<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 禁止访问 - 像素风</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            background: #2b2b2b;
            font-family: 'Press Start 2P', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8f8f2;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .pixel-container {
            text-align: center;
            background: #1e1e1e;
            padding: 40px;
            border: 8px solid #8b8b8b;
            box-shadow: inset 0 0 0 2px #4a4a4a, 0 0 0 4px #000;
            max-width: 650px;
            margin: 20px;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: #ff5555;
            text-shadow: 4px 4px 0 #550000;
        }

        .subtitle {
            font-size: 1rem;
            margin: 20px 0;
            background: #000;
            display: inline-block;
            padding: 10px 15px;
            border-left: 4px solid #ff5555;
        }

        p {
            font-size: 0.8rem;
            line-height: 1.6;
            margin: 30px 0;
        }

        .btn {
            display: inline-block;
            background: #4caf50;
            padding: 12px 24px;
            text-decoration: none;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            border: none;
            box-shadow: 0 4px 0 #1b5e20;
            transition: 0.05s linear;
            cursor: pointer;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .pixel-art {
            font-size: 4rem;
            letter-spacing: 10px;
            filter: drop-shadow(2px 2px 0 #000);
        }
    </style>
</head>
<body>
<div class="pixel-container">
    <div class="pixel-art">🚫👾</div>
    <h1>403</h1>
    <div class="subtitle">> ACCESS DENIED_</div>
    <p>YOU SHALL NOT PASS!<br>暂无权限访问，请联系管理员！</p>
    <a href="/" class="btn">⇦ 返回首页</a>
</div>
</body>
</html>
