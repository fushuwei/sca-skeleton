<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <title>新易云大数据平台 - 后台</title>
    <style>
      body {
        margin: 0;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
        background: #fff;
        z-index: 9999;
      }

      .app-loader-spinner {
        box-sizing: border-box;
        width: 46px;
        height: 46px;
        position: relative;
      }

      .app-loader-spinner:before,
      .app-loader-spinner:after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 100%;
        border: 3px solid transparent;
        border-top-color: #1976d2;
        /* 显式声明，避免 Quasar normalize 的 *:before { box-sizing: inherit }
           在 CSS 异步加载时改变 pseudo-element 尺寸，导致刷新闪烁两个大小 */
        box-sizing: border-box;
      }

      .app-loader-spinner:before {
        z-index: 100;
        animation: app-loader-spin 1s linear infinite;
      }

      .app-loader-spinner:after {
        border: 3px solid #ccc;
      }

      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }

      .app-loader-text {
        font-size: 16px;
        color: #666;
        font-family: "JetBrains Mono", "OPPO Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading">
      <div class="app-loader-spinner"></div>
      <div class="app-loader-text">正在加载...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
