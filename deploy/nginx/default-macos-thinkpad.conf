# =============================================================================
# SCA Skeleton 开发环境 Nginx 反向代理配置（MacOS + Thinkpad 局域网联调）
#
# 设计原则：
#   localhost 端口 与 Thinkpad 服务端口完全一致，1:1 映射。
#   举例：Thinkpad 的 admin 在 :5173，则 localhost:5173 就是 admin。
#   出问题时看端口号就能定位，无需记忆域名映射。
#
# 架构：
#   MacOS 本机         ← Nginx 反向代理（统一入口）
#   Thinkpad (:5173)   ← admin Vite Dev Server
#   Thinkpad (:5174)   ← portal Vite Dev Server
#   Thinkpad (:9999)   ← 网关（Spring Cloud Gateway）
#   Thinkpad (:18848)   ← Nacos 注册中心/配置中心
#   MacOS IDEA (:9001) ← auth 服务（本地启动，注册到 Thinkpad Nacos）
#   MacOS IDEA (:9002) ← system 服务（同上）
#
# 注意：
#   MacOS 上的 auth/system 等服务的 .env 中 NACOS_SERVER_ADDR 需指向
#   192.168.1.105:18848，才能正确注册到 Thinkpad 的 Nacos。
#
# 前端 env 调整（apps/admin|portal/.env.development）：
#   VITE_OAUTH_REDIRECT_URI=http://localhost:5173/oauth/callback  (admin)
#   VITE_OAUTH_REDIRECT_URI=http://localhost:5174/oauth/callback (portal)
#   VITE_DEV_PROXY_TARGET=http://localhost:9999                   (Thinkpad 本机，直连网关)
#   VITE_API_BASE_URL=/api-dev
#
# 部署方式：放入 /etc/nginx/conf.d/ 目录，由
#   include /etc/nginx/conf.d/*.conf; 自动加载。
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================================
# Admin 前端 ← Thinkpad Vite Dev Server :5173
# ============================================================================
server {
    listen 5173;
    server_name localhost;

    # ---- server 层公共设置（被所有 location 继承）----
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cookie_path / /;
    proxy_cookie_domain 192.168.1.105 $host;

    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # ---- API：直连 Thinkpad 网关（不走 Vite 代理）----
    location /api-dev/ {
        rewrite ^/api-dev(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    location /api/ {
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- SPA + HMR WebSocket ← Vite Dev Server ----
    # 超时 60s：Vite HMR 需要 WebSocket 长连等待文件变更通知
    location / {
        proxy_pass http://192.168.1.105:5173;
        proxy_cache off;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# Portal 前端 ← Thinkpad Vite Dev Server :5174
# ============================================================================
server {
    listen 5174;
    server_name localhost;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cookie_path / /;
    proxy_cookie_domain 192.168.1.105 $host;

    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    location /api-dev/ {
        rewrite ^/api-dev(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    location /api/ {
        proxy_pass http://192.168.1.105:9999;
    }

    location / {
        proxy_pass http://192.168.1.105:5174;
        proxy_cache off;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# 网关 ← Thinkpad Spring Cloud Gateway :9999
# ============================================================================
server {
    listen 9999;
    server_name localhost;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cookie_path / /;
    proxy_cookie_domain 192.168.1.105 $host;

    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    location / {
        proxy_pass http://192.168.1.105:9999;
    }
}

# ============================================================================
# Nacos 控制台 ← Thinkpad Nacos :18848
# ============================================================================
server {
    listen 18848;
    server_name localhost;

    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cookie_path / /;
    proxy_cookie_domain 192.168.1.105 $host;

    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    location / {
        proxy_pass http://192.168.1.105:18848;
    }
}

# ============================================================================
# 默认 catch-all：未匹配端口请求直接拒绝
# ============================================================================
server {
    listen 80 default_server;
    return 444;
}
