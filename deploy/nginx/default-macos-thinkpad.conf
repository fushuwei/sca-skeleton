# ============================================================================
# Vite HMR 使用 WebSocket 长连。普通 HTTP 请求无 Upgrade 头时传 close，
# 带 Upgrade 头的 WebSocket 请求传 upgrade 以建立隧道
# ============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================================
# 统一入口 :8080
#   /             → Portal SPA（:5174）
#   /admin/       → Admin SPA（:5173, base=/admin/）
#   /api/         → 网关 :9999（strip /api）
#   /auth/        → 网关 :9999（保留 /auth，网关路由 Path=/auth/**）
# ============================================================================
server {
    listen 8080;
    server_name localhost;

    # ---- 公共设置 ----
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_cookie_path / /;
    proxy_cookie_domain 192.168.1.105 $host;

    proxy_buffering off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # ---- REST API（strip /api 后转发网关）----
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- OAuth2 / 登录页（proxy_pass 没有 / 结尾，所以会保留 /auth/ 前缀， 例如：http://localhost:9999/auth/）----
    location /auth/ {
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- Admin SPA（超时 60s 支撑 HMR WebSocket）----
    location /admin/ {
        proxy_pass http://localhost:5173;
        proxy_cache off;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Portal SPA（默认，超时 60s 支撑 HMR WebSocket）----
    location / {
        proxy_pass http://localhost:5174;
        proxy_cache off;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# 默认拒绝 — 本机无服务监听 80，兜底防止恶意扫描或容器端口映射误命中
# ============================================================================
server {
    listen 80 default_server;
    return 444;
}
