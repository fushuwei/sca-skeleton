# =============================================================================
# SCA Skeleton 生产环境 Nginx 反向代理配置
#
# 部署方式：将本文件放入 /etc/nginx/conf.d/ 目录，由 nginx.conf 中的
#           include /etc/nginx/conf.d/*.conf; 自动加载。
#
# 关键设计：
#   1. Nginx 是整个系统唯一的公网入口，网关进程禁止直接暴露在公网，
#      避免攻击者绕过 Nginx 直接构造 X-Forwarded-For 伪造客户端 IP。
#   2. X-Forwarded-For 链通过 $proxy_add_x_forwarded_for 自动追加，
#      网关侧使用 XForwardedRemoteAddressResolver.maxTrustedIndex(1) 解析。
#   3. 内部业务头（X-User-Id / X-Tenant-Id 等）在入口处显式置空，
#      与网关 RequestHeaderGovernanceGlobalFilter 形成双重防护。
#
# 维护人：Fu Wei
# =============================================================================

# WebSocket Upgrade 头映射；定义在文件顶部以便 server 块直接引用
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# 网关上游集群
# 多实例部署时按需追加 server 行；keepalive 复用 TCP 连接减少握手开销。
# -----------------------------------------------------------------------------
upstream sca_skeleton_gateway {
    server 127.0.0.1:9999 max_fails=3 fail_timeout=30s;
    # server gateway-2.internal:9999 max_fails=3 fail_timeout=30s;

    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# -----------------------------------------------------------------------------
# HTTP 80：强制跳转 HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sca-skeleton.example.com;

    # ACME 证书续期挑战路径（Let's Encrypt 等自动证书工具）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余请求一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 443：业务统一入口
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sca-skeleton.example.com;

    # ====== SSL/TLS ======
    ssl_certificate     /etc/nginx/ssl/api.sca-skeleton.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.sca-skeleton.example.com.key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling，加速握手
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # HSTS（启用前请确认证书与域名稳定，否则会锁定无法回滚）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ====== 客户端连接限制 ======
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ====== 边界限流（与网关 RequestRateLimiter 形成双层防护，可按需启用）======
    # 全局连接数限制：单 IP 最多 100 并发连接
    # limit_conn perip 100;
    # 请求速率限制：单 IP 平均 20 req/s，突发允许 50
    # limit_req zone=perip burst=50 nodelay;

    # ====== 访问日志（包含 X-Forwarded-For，便于排查 IP 解析）======
    access_log /var/log/nginx/sca-skeleton.access.log main;
    error_log  /var/log/nginx/sca-skeleton.error.log warn;

    # =========================================================================
    # 业务路径：反代到网关
    # =========================================================================
    location / {
        proxy_pass http://sca_skeleton_gateway;
        proxy_http_version 1.1;

        # ---- 必备转发头：网关 maxTrustedIndex(1) 依赖 X-Forwarded-For ----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;

        # ---- 边界清理：外部不允许携带的内部身份头（网关侧仍会再次清理）----
        proxy_set_header X-User-Id    "";
        proxy_set_header X-User-Name  "";
        proxy_set_header X-Tenant-Id  "";
        proxy_set_header X-User-Roles "";
        proxy_set_header X-From       "";

        # ---- WebSocket 透传 ----
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- 超时（与网关 httpclient.response-timeout 对齐，略大以避免提前断开）----
        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;

        # ---- 流式响应不缓冲（SSE、下载等场景）----
        proxy_buffering off;
        proxy_request_buffering off;

        # ---- 失败重试（仅幂等条件下生效）----
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    # =========================================================================
    # 监控端点：默认仅允许内网访问，公网请通过堡垒机或独立监控域名访问
    # =========================================================================
    location ^~ /actuator/ {
        # 允许 RFC 1918 私网网段访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://sca_skeleton_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
