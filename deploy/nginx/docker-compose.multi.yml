# ============================================================================
# SCA Skeleton 生产环境 Nginx 容器（多端口多域名版）
#
# 架构：
#   8080 → Admin SPA + Admin API（admin.newease.cloud）
#   8081 → Portal SPA + Portal API（portal.newease.cloud）
#   两个 server 块靠 server_name 区分，靠 listen 端口区分
# ============================================================================
services:
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: no
    ports:
      # Admin 入口
      - "8080:8080"
      # Portal 入口
      - "8081:8081"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
