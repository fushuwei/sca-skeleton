# ============================================================================
# Nginx 主配置（替代镜像默认 /etc/nginx/nginx.conf）
# 站点配置统一放在 /etc/nginx/conf.d/*.conf 由 include 加载
# ============================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式：包含 X-Forwarded-For 便于追踪客户端真实 IP
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # =========================================================================
    # 真实客户端 IP 还原（配合 SakuraFrp Proxy Protocol v2 使用）
    # -------------------------------------------------------------------------
    # 流量路径：浏览器 → SakuraFrp 节点(TLS 终结) → frpc(宿主机) → Docker 端口映射
    #           → docker-proxy(SNAT) → Nginx 容器 → 网关 → 业务服务
    # 问题：frpc 到 Nginx 这段经过 docker 端口映射 (docker-proxy)，源 IP 被 SNAT 改写
    #       为 Docker 网桥网关 (如 172.18.0.1)，并非真实客户端 IP，导致 $remote_addr
    #       失真、登录日志 IP 全是 172.18.0.1、位置显示"内网IP"。且 HTTPS 隧道无法用
    #       X-Forwarded-For 头传真实 IP（XFF 仅适用于 HTTP 隧道）。
    # 方案：frpc 隧道开启 Proxy Protocol v2，listen 启用 proxy_protocol，
    #       realip 模块从 PROXY Protocol 头取出真实 IP 覆盖 $remote_addr，
    #       下游 proxy_set_header(X-Forwarded-For / X-Real-IP) 与日志随之自动正确。
    # 信任来源：docker-proxy SNAT 后的源 IP 段 + 本机回环（仅这些来源才允许改写 IP）
    # 前提：nginx 镜像须含 http_realip_module（官方 nginx:stable 默认已编译）
    #       验证：docker exec nginx nginx -V 2>&1 | grep -o 'http_realip_module'
    # =========================================================================
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   proxy_protocol;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip 压缩（前端构建产物已带 hash，可安全开启）
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;

    # 加载站点配置
    include /etc/nginx/conf.d/*.conf;
}
