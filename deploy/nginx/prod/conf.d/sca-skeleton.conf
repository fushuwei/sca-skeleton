# ============================================================================
# SCA Skeleton 站点配置
#
# 架构：Nginx(80) 是唯一入口
#   /             → Portal SPA 静态文件 (/usr/share/nginx/html/portal)
#   /admin/       → Admin SPA 静态文件 (/usr/share/nginx/html/admin, base=/admin/)
#   /api/         → 网关 :9999 (strip /api)
#   /auth/        → 网关 :9999 (保留 /auth，网关路由 Path=/auth/**)
#
# 网关以 Java 进程运行在宿主机，容器内通过 host.docker.internal 访问。
# ============================================================================

# WebSocket Upgrade 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 网关上游（host.docker.internal 由 compose extra_hosts 注入，指向宿主机）
upstream sca_gateway {
    server host.docker.internal:9999 max_fails=3 fail_timeout=30s;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # 内网 IP 访问，匹配所有 Host

    # 客户端请求体限制（文件上传等场景）
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 访问日志
    access_log /var/log/nginx/sca-skeleton.access.log main;
    error_log  /var/log/nginx/sca-skeleton.error.log warn;

    # 公共安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：connect-src 'self' 覆盖 /api、/auth 同源请求
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # =========================================================================
    # REST API：strip /api 后转发网关
    # 前端 VITE_API_BASE_URL=/api，请求 /api/xxx → 网关 /xxx
    # =========================================================================
    location /api/ {
        proxy_pass http://sca_gateway;
        proxy_http_version 1.1;

        rewrite ^/api(/.*)$ $1 break;

        # 必备转发头：网关 XForwardedRemoteAddressResolver.maxTrustedIndex(1) 依赖 X-Forwarded-For
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;

        # 边界清理：禁止外部携带内部身份头（与网关 RequestHeaderGovernanceGlobalFilter 形成双重防护）
        proxy_set_header X-User-Id    "";
        proxy_set_header X-User-Name  "";
        proxy_set_header X-Tenant-Id  "";
        proxy_set_header X-User-Roles "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;

        # 流式响应不缓冲（SSE、下载等场景）
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # =========================================================================
    # OAuth2 / 登录页：保留 /auth 前缀转发网关（网关路由 Path=/auth/**）
    # proxy_pass 无尾斜杠，保留 /auth/ 前缀传给后端
    # =========================================================================
    location /auth/ {
        proxy_pass http://sca_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;

        # 登录页 Set-Cookie 统一根路径，便于前端读取
        proxy_cookie_path / /;

        # WebSocket 透传
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;

        proxy_buffering off;
    }

    # =========================================================================
    # Admin SPA：base=/admin/，统一带斜杠访问
    # root 指向 html 父目录，/admin/xxx → /usr/share/nginx/html/admin/xxx
    # =========================================================================
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # =========================================================================
    # Portal SPA：默认根路径
    # =========================================================================
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 监控端点：仅内网访问（actuator 通过网关暴露）
    # =========================================================================
    location ^~ /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://sca_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
