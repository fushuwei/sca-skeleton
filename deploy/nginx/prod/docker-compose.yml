# ============================================================================
# SCA Skeleton 生产环境 Nginx 容器
#
# 部署目录：/data/docker/containers/nginx
# 宿主机服务（gateway/auth/system）以 Java 进程运行，本容器仅负责 Nginx
# 网关以进程方式监听宿主机 :9999，容器内通过 host.docker.internal 访问
# ============================================================================
services:
  nginx:
    # 最新稳定版标签；如需固定版本，可改为如 nginx:1.27.x
    image: nginx:stable
    container_name: nginx
    restart: no
    ports:
      - "80:80"
    volumes:
      # Nginx 主配置（替代镜像默认 /etc/nginx/nginx.conf）
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      # 站点配置（主配置通过 include /etc/nginx/conf.d/*.conf 加载）
      - ./conf.d:/etc/nginx/conf.d:ro
      # 前端静态资源（admin/portal 打包后的 dist 内容）
      - ./html:/usr/share/nginx/html:ro
      # 日志输出到宿主机
      - ./logs:/var/log/nginx
    # 让容器内可通过 host.docker.internal 解析到宿主机，访问宿主机 :9999 网关
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
