services:
  nginx:
    image: nginx:1.31.3
    container_name: nginx
    restart: no
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    extra_hosts:
      # 让容器内可通过 host.docker.internal 解析到宿主机，访问宿主机 :9999 网关
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
