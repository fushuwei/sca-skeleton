# ============================================================================
# SCA Skeleton 站点配置
#
# 架构：Nginx(8080) 是唯一入口
#   /             → Portal SPA 静态文件 (/usr/share/nginx/html/portal)
#   /admin/       → Admin SPA 静态文件 (/usr/share/nginx/html/admin, base=/admin/)
#   /api/         → 网关 :9999 (strip /api；OAuth2 token/revoke、验证码、业务 API 统一走此入口)
#
# Nginx 容器在 bridge 网络，通过宿主机 IP 访问 Java 服务（与 redis/mysql 风格一致）
# 公共配置全部上提 server 块，location 只写差异（参考 default-macos-thinkpad.conf 风格）
# ============================================================================

# WebSocket Upgrade 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 启用 proxy_protocol：接收 frpc 通过 PROXY Protocol v2 头携带的真实客户端 IP
    # 注意：启用后该端口所有连接必须先发 PROXY Protocol 头，浏览器直连 192.168.1.105:8080 会失败
    #       （外网经 SakuraFrp 隧道访问不受影响）。需要本地/内网直连请用 SakuraFrp「内网访问」功能
    listen 8080 proxy_protocol;
    listen [::]:8080 proxy_protocol;
    server_name _;  # 匹配所有 Host（内网 IP / 外网域名 newease.cloud 均命中）

    # ---- 客户端请求限制 ----
    client_max_body_size 21m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ---- 访问日志 ----
    access_log /var/log/nginx/sca-skeleton.access.log main;
    error_log  /var/log/nginx/sca-skeleton.error.log warn;

    # =========================================================================
    # 公共代理设置（所有 location 共用，location 内只写差异）
    # =========================================================================
    proxy_http_version 1.1;

    # 必备转发头：Nginx 是唯一入口，listen proxy_protocol + realip 模块已把 $remote_addr
    # 还原为真实客户端 IP（见 nginx.conf 的 set_real_ip_from / real_ip_header）。
    # 直接用 $remote_addr 覆盖 X-Forwarded-For，防止客户端伪造该头欺骗下游服务
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-Host  $host;

    # WebSocket 透传
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cookie 改写（防御性配置，密码模式不使用 Cookie，但保留以防后续业务需要）：
    #   1. proxy_cookie_path 把后端 Set-Cookie 的 path 统一为 /
    #   2. proxy_cookie_domain 把后端 Set-Cookie 的 domain=192.168.1.105 改写为浏览器当前 host
    #      （外网访问 newease.cloud 时，若 cookie domain 是内网 IP，浏览器会拒收）
    #   说明：Spring 默认不设 cookie domain，此条为防御性配置，仅在 后端显式设了 domain 时生效
    proxy_cookie_path   / /;
    proxy_cookie_domain 192.168.1.105 $host;

    # 流式响应不缓冲（SSE、文件下载、OAuth2 设备码轮询等场景）
    proxy_buffering         off;
    proxy_request_buffering off;

    # 超时（与网关 httpclient.response-timeout 对齐，略大避免提前断开）
    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;

    # 失败重试（仅幂等请求生效，POST 等非幂等不会重试）
    proxy_next_upstream        error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries  2;
    proxy_next_upstream_timeout 5s;

    # ---- 公共安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：connect-src 'self' 覆盖 /api 同源请求；frame-ancestors 'none' 防点击劫持
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # =========================================================================
    # REST API：strip /api 后转发网关
    # 前端 VITE_API_BASE_URL=/api，请求 /api/xxx → 网关 /xxx
    # =========================================================================
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    # =========================================================================
    # Admin SPA：base=/admin/，统一带斜杠访问
    # 将不带斜杠的 /admin 重定向到 /admin/，避免浏览器对 /admin 和 /admin/ 的 sessionStorage 处理差异
    # 注意：必须用 https://$host 绝对 URL，不能用相对路径 /admin/。
    # nginx 对相对路径的 return 301 会用 $scheme://$host:$server_port 拼绝对 URL，
    # 此处 $server_port=8080、$scheme=http（cloudflared → nginx 走 HTTP），
    # 导致浏览器被跳转到 http://newease.cloud:8080/admin/（Error 1033 + 暴露内网端口）
    # =========================================================================
    location = /admin {
        return 301 https://$host/admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # index.html 禁止缓存：每次都拉最新 HTML，确保用户能加载到新版本的 JS/CSS（文件名带 hash 会变）
        location = /admin/ {
            add_header Cache-Control "no-cache" always;
        }
        location = /admin/index.html {
            add_header Cache-Control "no-cache" always;
        }
    }

    # =========================================================================
    # 静态资源强缓存（assets/ 目录：JS/CSS/字体/图片，文件名带内容 hash）
    # 浏览器缓存 1 年，immutable 标志告诉浏览器该资源永远不会变，无需发送条件请求验证
    # 文件内容变化时 Vite 会生成新 hash 的文件名，浏览器自然请求新 URL
    # =========================================================================
    location ~* ^/admin/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* ^/assets/ {
        root /usr/share/nginx/html/portal;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # =========================================================================
    # Portal SPA：默认根路径
    # =========================================================================
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html 禁止缓存（同 admin）
        location = / {
            add_header Cache-Control "no-cache" always;
        }
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }
    }

    # =========================================================================
    # 监控端点：仅内网访问（actuator 通过网关暴露）
    # =========================================================================
    location ^~ /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://192.168.1.105:9999;
    }
}
