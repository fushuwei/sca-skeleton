    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_cookie_path   / /;
    proxy_cookie_domain 192.168.1.105 $host;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;
    proxy_next_upstream        error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries  2;
    proxy_next_upstream_timeout 5s;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ---- REST API：/api/xxx → 网关 /xxx ----
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- OAuth2 / 登录页：保留 /auth 前缀 ----
    location /auth/ {
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- Portal SPA：根路径托管 ----
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
