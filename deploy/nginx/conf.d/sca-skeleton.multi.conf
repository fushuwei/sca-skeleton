# ============================================================================
# SCA Skeleton 站点配置（多端口多域名版）
#
# 架构：
#   8080 + admin.newease.cloud   → Admin SPA + /api/ + /auth/
#   8081 + portal.newease.cloud  → Portal SPA + /api/ + /auth/
#
# 两个 server 块同时靠 listen 端口 + server_name 双重区分：
#   - 端口不同：8080 vs 8081（内网 IP 访问靠端口区分）
#   - 域名不同：admin.newease.cloud vs portal.newease.cloud（外网 cloudflared 靠域名路由）
# ============================================================================

# WebSocket Upgrade 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 公共代理头（通过 include 在两个 server 中复用）
# 用单独文件放公共配置更优雅，这里为了演示直接内联

# =========================================================================
# Server 1: Admin 入口（端口 8080 + admin.newease.cloud）
# =========================================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name admin.newease.cloud;   # 外网域名访问时按此匹配；内网用 IP:8080 访问也能命中

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    access_log /var/log/nginx/sca-admin.access.log main;
    error_log  /var/log/nginx/sca-admin.error.log warn;

    # ---- 公共代理设置 ----
    # Nginx 是唯一入口，$remote_addr 即为真实客户端 IP
    # 直接用 $remote_addr 覆盖 X-Forwarded-For，防止客户端伪造该头欺骗下游服务
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_cookie_path   / /;
    proxy_cookie_domain 192.168.1.105 $host;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout    35s;
    proxy_read_timeout    35s;
    proxy_next_upstream        error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries  2;
    proxy_next_upstream_timeout 5s;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ---- REST API：/api/xxx → 网关 /xxx ----
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- OAuth2 / 登录页：保留 /auth 前缀 ----
    location /auth/ {
        proxy_pass http://192.168.1.105:9999;
    }

    # ---- Admin SPA：根路径托管（端口 8080 专供 admin，根路径即可）----
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 监控端点：仅内网 ----
    location ^~ /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://192.168.1.105:9999;
    }
}

# =========================================================================
# Server 2: Portal 入口（端口 8081 + portal.newease.cloud）
# =========================================================================
server {
    listen 8081;
    listen [::]:8081;
    server_name portal.newease.cloud;

    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    access_log /var/log/nginx/sca-portal.access.log main;
    error_log  /var/log/nginx/sca-portal.error.log warn;

    # ---- 公共代理设置 ----
