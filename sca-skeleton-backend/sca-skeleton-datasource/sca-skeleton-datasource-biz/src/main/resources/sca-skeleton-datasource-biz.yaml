# 数据源管理服务配置（开发阶段本地配置，不走 Nacos）
server:
  port: 9004

spring:
  application:
    name: sca-skeleton-datasource

  # 数据源（平台自身数据库，不是管理的外部数据源）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sca_skeleton}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 数据源管理模块配置
sca:
  datasource:
    # 驱动存储配置
    driver:
      storage-type: local
      base-path: ${user.home}/.sca-skeleton/drivers
    # 连接池全局配额
    pool:
      global-max-connections: 200
      max-pool-count: 50
    # 凭据加密配置
    crypto:
      secret-key: ${DATASOURCE_CRYPTO_KEY:sca-skeleton-dev-secret-key-2026}
    # 查询资源卡口
    query:
      max-rows: 1000
      query-timeout: 30
