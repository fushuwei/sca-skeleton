server:
  port: ${DATASOURCE_PORT:9004}

spring:
  application:
    name: sca-skeleton-datasource
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  config:
    import:
      - optional:classpath:sca-skeleton-common.yaml
      - optional:classpath:${spring.application.name}-${spring.profiles.active}.yaml
      - optional:nacos:sca-skeleton-common.yaml
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 数据源管理模块配置
sca:
  datasource:
    # 驱动存储配置
    driver:
      storage-type: ${DATASOURCE_DRIVER_STORAGE_TYPE:local}
      base-path: ${DATASOURCE_DRIVER_BASE_PATH:${user.home}/.sca-skeleton/drivers}
    # 连接池全局配额
    pool:
      global-max-connections: ${DATASOURCE_POOL_GLOBAL_MAX:200}
      max-pool-count: ${DATASOURCE_POOL_MAX_COUNT:50}
    # 凭据加密配置
    crypto:
      secret-key: ${DATASOURCE_CRYPTO_KEY:}
    # 查询资源卡口
    query:
      max-rows: ${DATASOURCE_QUERY_MAX_ROWS:1000}
      query-timeout: ${DATASOURCE_QUERY_TIMEOUT:30}
