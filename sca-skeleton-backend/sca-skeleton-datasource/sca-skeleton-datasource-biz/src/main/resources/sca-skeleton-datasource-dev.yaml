spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sca_datasource}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

  servlet:
    multipart:
      # 上传的驱动文件（JAR）本身的最大总大小：20MB
      max-file-size: 20MB
      # 整个上传请求的最大大小：21MB，请求里除了文件本身，还带着驱动名称等表单字段和少量协议包装开销，所以比文件上限多留 1MB，避免恰好 20MB 的文件被误拒
      max-request-size: 21MB

# 上传超限时的优雅兜底（关键修复）
# 当请求超过 max-request-size 触发 MaxUploadSizeExceededException 时，异常发生在请求体仍在上传的中途，
# Tomcat 需要先"吞掉"剩余未消费的请求体才能把错误响应发回客户端。
# Tomcat 默认 max-swallow-size=2MB：剩余未读部分一旦超过该值，Tomcat 会直接断开连接（reset），
# 导致 GlobalExceptionHandler 已生成的 JSON 错误响应无法送达，浏览器表现为 ERR_CONNECTION_RESET / "网络异常"。
# 设为 -1 表示不限制吞掉剩余请求体，确保超限时能返回标准 JSON 错误而不是重置连接（会多读/丢弃一段上行数据，换取可靠报错）。
server:
  tomcat:
    max-swallow-size: -1

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.fushuwei.scaskeleton.datasource.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    variables:
      "log.database": ${LOG_DATABASE:sca_platform}
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 数据源管理模块配置
sca:
  datasource:
    # 驱动存储配置
    driver:
      storage-type: local
      base-path: ${user.dir}/drivers
    # 连接池全局配额
    pool:
      global-max-connections: 200
      max-pool-count: 50
    # 凭据加密配置
    crypto:
      secret-key: ${DATASOURCE_CRYPTO_KEY:sca-skeleton-dev-secret-key-2026}
    # 查询资源卡口
    query:
      max-rows: 1000
      query-timeout: 30

  # MinIO 对象存储配置（生产环境启用，开发阶段默认关闭）
  minio:
    enabled: false
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: sca-skeleton
