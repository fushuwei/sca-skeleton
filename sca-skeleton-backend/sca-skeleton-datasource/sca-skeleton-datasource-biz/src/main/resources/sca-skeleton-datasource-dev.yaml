spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sca_datasource}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.fushuwei.scaskeleton.datasource.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# 数据源管理模块配置
sca:
  datasource:
    # 驱动存储配置
    driver:
      storage-type: local
      base-path: ${user.home}/.sca-skeleton/drivers
    # 连接池全局配额
    pool:
      global-max-connections: 200
      max-pool-count: 50
    # 凭据加密配置
    crypto:
      secret-key: ${DATASOURCE_CRYPTO_KEY:sca-skeleton-dev-secret-key-2026}
    # 查询资源卡口
    query:
      max-rows: 1000
      query-timeout: 30

  # MinIO 对象存储配置（生产环境启用，开发阶段默认关闭）
  minio:
    enabled: false
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: sca-skeleton
