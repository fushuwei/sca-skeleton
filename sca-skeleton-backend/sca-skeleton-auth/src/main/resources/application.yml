server:
  port: 9001

spring:
  application:
    name: sca-skeleton-auth
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  config:
    import:
      # 本地 classpath 兜底（Nacos 不可用时仍可启动 dev 环境）
      - optional:classpath:nacos/sca-skeleton-auth-${spring.profiles.active:dev}.yaml
      - optional:nacos:sca-skeleton-common.yaml
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
