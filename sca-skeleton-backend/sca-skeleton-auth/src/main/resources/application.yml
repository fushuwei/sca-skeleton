server:
  port: 9000

spring:
  application:
    name: sca-skeleton-auth
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sca_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s

# 业务侧 issuer，需与网关 resource server 配置一致
sca:
  auth:
    issuer: http://127.0.0.1:9000
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 604800
    captcha-ttl-seconds: 120

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  captcha:
    width: 130
    height: 48
    length: 4
