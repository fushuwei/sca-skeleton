server:
  port: 9000
  servlet:
    context-path: /

spring:
  application:
    name: sca-skeleton-auth

  # 数据源配置（用于 SAS JDBC 存储 + MyBatis-Plus 用户查询）
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sca_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  # Redis 配置（令牌黑名单、登录失败计数）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

  # Nacos 服务注册
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.fushuwei.sca.auth.infrastructure.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 逻辑删除字段与值与 SQL 中 is_deleted 列对应
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SCA 自定义认证服务配置
sca:
  auth:
    # 注册客户端：web 前端访问使用的 OAuth2 客户端
    client:
      web:
        client-id: sca-web-client
        client-secret: "{noop}sca-web-secret"
        # access_token 有效期（秒），默认 2 小时
        access-token-ttl: 7200
        # refresh_token 有效期（秒），默认 7 天
        refresh-token-ttl: 604800
    # JWT RSA 密钥对（生产环境应替换为外部密钥文件或 KMS）
    jwt:
      key-size: 2048
    # 登录失败锁定策略
    lock:
      # 最大连续失败次数（超过后锁定账号）
      max-fail-count: 5
      # 锁定持续时长（秒），默认 30 分钟
      lock-duration-seconds: 1800

# Actuator 配置：仅暴露必要端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
