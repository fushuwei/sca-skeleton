<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">登录 - Material Design 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" th:href="@{/auth/css/login.css}">
</head>
<body>
    <!-- ===== Loading 遮罩 ===== -->
    <div class="page-loader" id="pageLoader">
        <div class="loader"></div>
    </div>

    <div class="fullscreen-login md3">
        <div class="fullscreen-carousel">
            <div class="carousel-item active">
                <img src="https://images.pexels.com/photos/29612112/pexels-photo-29612112.jpeg" alt="轮播图1">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">欢迎使用我们的系统</h2>
                    <p class="md3-body-large">现代化的解决方案</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://images.pexels.com/photos/4253272/pexels-photo-4253272.jpeg" alt="轮播图2">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">强大的功能</h2>
                    <p class="md3-body-large">为您提供最佳体验</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://images.pexels.com/photos/36752381/pexels-photo-36752381.jpeg" alt="轮播图3">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">安全可靠</h2>
                    <p class="md3-body-large">保护您的数据安全</p>
                </div>
            </div>

            <div class="carousel-controls">
                <button class="md3-icon-button carousel-prev" id="prevBtn">
                    <span class="material-symbols-rounded">chevron_left</span>
                </button>
                <div class="carousel-indicators">
                    <span class="indicator active" data-slide="0"></span>
                    <span class="indicator" data-slide="1"></span>
                    <span class="indicator" data-slide="2"></span>
                </div>
                <button class="md3-icon-button carousel-next" id="nextBtn">
                    <span class="material-symbols-rounded">chevron_right</span>
                </button>
            </div>
        </div>

        <div class="floating-login-container">
            <div class="login-box md3-surface elevation-3">
                <div class="login-header">
                    <div class="login-logo">
                        <span class="material-symbols-rounded logo-icon">admin_panel_settings</span>
                    </div>
                    <h1 class="md3-display-small login-title">用户登录</h1>
                </div>

                <form id="loginForm" th:action="${loginProcessingUrl}" method="post" onsubmit="return false">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <!-- 登录渠道标识 -->
                    <input type="hidden" name="loginChannel" th:value="${loginChannel}"/>

                    <div class="md3-text-field-container">
                        <div class="md3-text-field-wrapper">
                            <span class="material-symbols-rounded field-icon">person</span>
                            <input class="md3-text-field with-icon" type="text" id="username" name="username" placeholder="请输入用户名/邮箱/手机号">
                            <div class="error-message" id="username-error" style="display: none;">
                                <span class="material-symbols-rounded error-icon">error</span>
                                <span class="error-text"></span>
                            </div>
                        </div>
                    </div>

                    <div class="md3-text-field-container">
                        <div class="md3-text-field-wrapper">
                            <span class="material-symbols-rounded field-icon">lock</span>
                            <input class="md3-text-field with-icon" type="password" id="password" name="password" placeholder="请输入密码">
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <span class="material-symbols-rounded">visibility</span>
                            </button>
                            <div class="error-message" id="password-error" style="display: none;">
                                <span class="material-symbols-rounded error-icon">error</span>
                                <span class="error-text"></span>
                            </div>
                        </div>
                    </div>

                    <!-- 图形验证码：密码框下方一行，左输入框右图片 -->
                    <div class="md3-text-field-container captcha-row">
                        <div class="md3-text-field-wrapper">
                            <span class="material-symbols-rounded field-icon">verified_user</span>
                            <input class="md3-text-field with-icon captcha-input" type="text" id="captchaCode" name="captchaCode"
                                   placeholder="请输入验证码"
                                   maxlength="6" autocomplete="off">
                            <div class="error-message" id="captchaCode-error" style="display: none;">
                                <span class="material-symbols-rounded error-icon">error</span>
                                <span class="error-text"></span>
                            </div>
                        </div>
                        <div class="captcha-img-wrapper">
                            <img id="captchaImg"
                                 th:attr="data-captcha-url=@{/auth/captcha/generate}"
                                 th:src="@{/auth/captcha/generate(key=${captchaKey})}"
                                 alt="验证码">
                        </div>
                        <input type="hidden" name="captchaKey" id="captchaKey" th:value="${captchaKey}">
                    </div>

                    <div class="form-options">
                        <label class="md3-checkbox-container">
                            <input type="checkbox" id="remember">
                            <span class="md3-checkbox enhanced"></span>
                            <span class="md3-checkbox-label md3-body-medium">记住我</span>
                        </label>
                        <a href="#" class="md3-link md3-body-medium">忘记密码？</a>
                    </div>

                    <button type="submit" class="md3-button md3-filled-button login-button" id="loginBtn">
                        登录
                    </button>
                </form>

                <div class="additional-options">
                    <p class="md3-body-small">其他登录方式</p>
                    <div class="social-login">
                        <button class="social-login-button">
                            <span class="material-symbols-rounded">smartphone</span>
                        </button>
                        <button class="social-login-button">
                            <span class="material-symbols-rounded">qr_code_scanner</span>
                        </button>
                        <button class="social-login-button">
                            <span class="material-symbols-rounded">fingerprint</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/auth/js/login.js}"></script>
</body>
</html>
