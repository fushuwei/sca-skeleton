<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">登录 - Material Design 3</title>
    <link rel="icon" type="image/x-icon" th:href="@{/auth/images/favicon.ico}">
    <link rel="stylesheet" th:href="@{/auth/css/login.css}">
</head>
<body>
    <!-- ===== Loading 遮罩 ===== -->
    <div class="page-loader" id="pageLoader">
        <div class="spinner"></div>
        <p class="loading-text">正在加载...</p>
    </div>

    <div class="fullscreen-login md3">
        <div class="fullscreen-carousel">
            <div class="carousel-item active">
                <img th:src="@{/auth/images/carousel1.jpg}" alt="轮播图1">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">欢迎使用我们的系统</h2>
                    <p class="md3-body-large">现代化的解决方案</p>
                </div>
            </div>
            <div class="carousel-item">
                <img th:src="@{/auth/images/carousel2.jpg}" alt="轮播图2">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">强大的功能</h2>
                    <p class="md3-body-large">为您提供最佳体验</p>
                </div>
            </div>
            <div class="carousel-item">
                <img th:src="@{/auth/images/carousel3.jpg}" alt="轮播图3">
                <div class="carousel-caption">
                    <h2 class="md3-headline-large">安全可靠</h2>
                    <p class="md3-body-large">保护您的数据安全</p>
                </div>
            </div>

            <div class="carousel-controls">
                <button class="md3-icon-button carousel-prev" id="prevBtn">
                    <i class="login-icon login-icon-chevron_left"></i>
                </button>
                <div class="carousel-indicators">
                    <span class="indicator active" data-slide="0"></span>
                    <span class="indicator" data-slide="1"></span>
                    <span class="indicator" data-slide="2"></span>
                </div>
                <button class="md3-icon-button carousel-next" id="nextBtn">
                    <i class="login-icon login-icon-chevron_right"></i>
                </button>
            </div>
        </div>

        <div class="floating-login-container">
            <div class="login-box md3-surface elevation-3">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="login-icon login-icon-admin_panel_settings logo-icon"></i>
                    </div>
                    <h1 class="md3-display-small login-title">用户登录</h1>
                </div>

                <form id="loginForm" th:action="${loginProcessingUrl}" method="post">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <!-- 登录渠道标识 -->
                    <input type="hidden" name="loginChannel" th:value="${loginChannel}"/>

                    <div class="md3-text-field-container">
                        <div class="md3-text-field-wrapper">
                            <i class="login-icon login-icon-person field-icon"></i>
                            <input class="md3-text-field with-icon" type="text" id="username" name="username" placeholder="请输入用户名/邮箱/手机号" value="admin">
                            <div class="error-message" id="username-error" style="display: none;">
                                <i class="login-icon login-icon-error error-icon"></i>
                                <span class="error-text"></span>
                            </div>
                        </div>
                    </div>

                    <div class="md3-text-field-container">
                        <div class="md3-text-field-wrapper">
                            <i class="login-icon login-icon-lock field-icon"></i>
                            <input class="md3-text-field with-icon" type="password" id="password" name="password" placeholder="请输入密码" value="admin">
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="login-icon login-icon-visibility"></i>
                            </button>
                            <div class="error-message" id="password-error" style="display: none;">
                                <i class="login-icon login-icon-error error-icon"></i>
                                <span class="error-text"></span>
                            </div>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="md3-checkbox-container">
                            <input type="checkbox" id="remember">
                            <span class="md3-checkbox enhanced"></span>
                            <span class="md3-checkbox-label md3-body-medium">记住我</span>
                        </label>
                        <a href="#" class="md3-link md3-body-medium">忘记密码？</a>
                    </div>

                    <button type="submit" class="md3-button md3-filled-button login-button" id="loginBtn">
                        登录
                    </button>
                </form>

                <div class="additional-options">
                    <p class="md3-body-small">其他登录方式</p>
                    <div class="social-login">
                        <button class="social-login-button">
                            <i class="login-icon login-icon-smartphone"></i>
                        </button>
                        <button class="social-login-button">
                            <i class="login-icon login-icon-qr_code_scanner"></i>
                        </button>
                        <button class="social-login-button">
                            <i class="login-icon login-icon-fingerprint"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/auth/js/login.js}"></script>
</body>
</html>
