<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle}">SCA 管理后台登录</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 20px 45px rgba(0,0,0,.25); }
        h1 { margin: 0 0 8px; font-size: 22px; color: #0f172a; }
        p { margin: 0 0 24px; color: #64748b; font-size: 14px; }
        label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .badge { display: inline-block; background: #dbeafe; color: #1d4ed8; font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="card">
    <span class="badge">Admin</span>
    <h1 th:text="${pageTitle}">SCA 管理后台登录</h1>
    <p>OAuth2 授权码 + PKCE · 凭证仅在 Auth 服务域内提交</p>
    <div class="error" th:if="${loginError}">用户名或密码错误，请重试。</div>
    <form th:action="${loginProcessingUrl}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="loginChannel" th:value="${loginChannel}"/>
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required placeholder="admin"/>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"/>
        <button type="submit">登录</button>
    </form>
</div>
</body>
</html>
