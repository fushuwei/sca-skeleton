server:
  # 经网关访问时根据 X-Forwarded-* 还原对外 URL，避免登录成功后 SavedRequest 回跳到内网地址
  forward-headers-strategy: framework

spring:
  # 数据源配置（用于 SAS JDBC 存储 + MyBatis-Plus 用户查询）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/sca_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  # Redis 配置（OAuth2 授权记录、RegisteredClient 缓存）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

  # Thymeleaf 登录页模板
  thymeleaf:
    cache: false

  # Spring Session：分布式集群共享 Session（替代单机内存 HttpSession）
  # Spring Boot 4.0 移除了 spring.session.store-type，自动按 classpath 推断（Redis 优先）
  session:
    data:
      redis:
        namespace: spring:session
    timeout: 30m

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.fushuwei.scaskeleton.auth.infrastructure.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SCA 自定义认证服务配置
sca:
  security:
    resource-server:
      enabled: false
  auth:
    # 浏览器可见的 OAuth2 授权服务根 URL（开发环境经 Vite 代理到网关，生产环境经 Nginx/网关对外暴露）
    # 必须与前端访问地址一致，用于生成登录重定向和授权端点地址
    issuer: ${AUTH_ISSUER:http://localhost:8080/auth}
    # 浏览器访问 Auth 登录页/表单时的 URL 前缀（网关 /auth/** → StripPrefix=1）
    public-path-prefix: ${AUTH_PUBLIC_PATH_PREFIX:/auth}
    clients:
      admin:
        id: "100"
        client-id: sca-admin-client
        # OAuth2 授权码回调地址列表，支持多个访问入口（如域名 + 内网 IP）
        # 例如：https://newease.cloud/admin/oauth/callback,http://192.168.1.105:8080/admin/oauth/callback
        redirect-uris: ${AUTH_ADMIN_REDIRECT_URIS:http://localhost:8080/oauth/callback}
        access-token-ttl: 900
        refresh-token-ttl: 7200
      portal:
        id: "200"
        client-id: sca-portal-client
        # 同 admin.redirect-uris，支持多个访问入口
        redirect-uris: ${AUTH_PORTAL_REDIRECT_URIS:http://localhost:9090/oauth/callback}
        access-token-ttl: 900
        refresh-token-ttl: 7200
    lock:
      max-fail-count: 5
      lock-duration-seconds: 1800
    # 登录页动态配置（通过 Thymeleaf 注入；未来可扩展为数据库驱动）
    login:
      system-name: "SCA Skeleton"
      logo-url: ""
      copyright: "© 2025 SCA Skeleton. All rights reserved."
      # 表单提交 URL：网关模式下使用 /auth/login/authenticate（浏览器经网关 POST），
      # 直连模式下使用 /login/authenticate
      login-processing-url: "/auth/login/authenticate"
      carousel-images:
        - "/auth/images/carousel1.jpg"
        - "/auth/images/carousel2.jpg"
        - "/auth/images/carousel3.jpg"

  # 验证码配置
  captcha:
    width: 120
    height: 44
    code-length: 4
    expire-seconds: 120
    redis-key-prefix: "captcha:"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
