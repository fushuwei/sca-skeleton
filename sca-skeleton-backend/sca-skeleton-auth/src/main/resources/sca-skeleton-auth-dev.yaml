spring:
  # 数据源配置（用于 SAS JDBC 存储 + MyBatis-Plus 用户查询）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sca_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000

  # Redis 配置（OAuth2 授权记录、RegisteredClient 缓存）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-active: 8

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: io.github.fushuwei.scaskeleton.auth.infrastructure.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SCA 自定义认证服务配置
sca:
  security:
    resource-server:
      enabled: false
  auth:
    # OAuth2 授权服务 issuer URL，必须与浏览器实际可达路径一致：前端走 /api 前缀，经 Vite/Nginx 代理 → 网关 /auth/** → auth 服务
    issuer: ${AUTH_ISSUER:http://localhost:8080/api/auth}
    clients:
      admin:
        id: "100"
        client-id: sca-admin-client
        # 机密客户端密钥（明文配置，初始化时由 PasswordEncoder 加密后写入 DB）
        # 生产环境通过环境变量注入：AUTH_ADMIN_CLIENT_SECRET
        client-secret: ${AUTH_ADMIN_CLIENT_SECRET:admin-secret}
        access-token-ttl: 900
        refresh-token-ttl: 7200
      portal:
        id: "200"
        client-id: sca-portal-client
        client-secret: ${AUTH_PORTAL_CLIENT_SECRET:portal-secret}
        access-token-ttl: 900
        refresh-token-ttl: 7200
    lock:
      max-fail-count: 5
      lock-duration-seconds: 1800

  # 验证码配置
  captcha:
    width: 120
    height: 44
    code-length: 4
    expire-seconds: 120
    redis-key-prefix: "captcha"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
