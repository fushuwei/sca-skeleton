
sca:
  # 安全配置（OAuth2 资源服务器）
  security:
    # 资源服务器开关，默认开启（认证服务在自身配置中覆盖为 false）
    resource-server:
      enabled: true
    # 免认证路径白名单，Ant 风格匹配，命中后跳过 Bearer Token 校验
    permit-paths:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /webjars/**
      - /actuator/health
      - /actuator/info

# API 文档配置（SpringDoc OpenAPI 3 + Swagger UI）
springdoc:
  api-docs:
    # 是否暴露 /v3/api-docs JSON 端点，生产环境建议关闭
    enabled: true
    info:
      # 文档标题
      title: AI 数据中台
      # 文档描述
      description: AI 数据中台项目接口文档
      # API 版本号
      version: 1.0.0
      # 联系人信息
      contact:
        name:  Fu Wei
        email: fushuwei90@gmail.com
        url: https://github.com/fushuwei
      # 许可证信息
      license:
        name: 未经授权，禁止传播
        url: https://github.com/fushuwei
  swagger-ui:
    # 是否暴露 /swagger-ui/** 可视化页面，生产环境建议关闭
    enabled: true
